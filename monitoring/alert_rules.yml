groups:
  - name: heart-risk-api
    rules:
      - alert: HeartApiDown
        expr: up{job="heart-risk-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Heart risk API target {{ $labels.instance }} is down"
      - alert: HeartApiHighErrorRate
        expr: |
          sum(rate(heart_api_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(heart_api_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of API requests are failing"
      - alert: HeartApiSlowPredictions
        expr: |
          histogram_quantile(0.95,
            sum(rate(heart_api_request_latency_seconds_bucket{endpoint="/predict"}[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 /predict latency above 500 ms"
      - alert: PredictionDriftHighRiskShare
        # Training prevalence is ~46%; a sustained jump suggests input drift.
        expr: |
          sum(rate(heart_api_predictions_total{label="heart_disease"}[30m]))
            / clamp_min(sum(rate(heart_api_predictions_total[30m])), 1e-9) > 0.8
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Share of positive predictions above 80% - check for data drift"
