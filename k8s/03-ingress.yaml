# Requires the NGINX ingress controller (`minikube addons enable ingress`, or
# the ingress-nginx cloud manifest on Docker Desktop - see deploy scripts).
# Test: curl -H "Host: heart-risk.local" http://localhost/health
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-risk-api
  namespace: heart-risk
spec:
  ingressClassName: nginx
  rules:
    - host: heart-risk.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-risk-api
                port:
                  number: 8080
