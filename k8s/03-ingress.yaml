# Requires the NGINX ingress controller (`minikube addons enable ingress`).
# Add "<minikube ip> heart-risk.local" to your hosts file to use it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-risk-api
  namespace: heart-risk
spec:
  ingressClassName: nginx
  rules:
    - host: heart-risk.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-risk-api
                port:
                  number: 80
