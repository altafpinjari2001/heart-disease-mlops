# LoadBalancer service on port 8080 (port 80 is left to the NGINX ingress
# controller). Docker Desktop publishes it on http://localhost:8080; on
# Minikube run `minikube tunnel` and use the EXTERNAL-IP.
apiVersion: v1
kind: Service
metadata:
  name: heart-risk-api
  namespace: heart-risk
  labels:
    app: heart-risk-api
spec:
  type: LoadBalancer
  selector:
    app: heart-risk-api
  ports:
    - name: http
      port: 8080
      targetPort: http
