# LoadBalancer service. On Minikube run `minikube tunnel` to get an
# external IP; on Docker Desktop it is published on localhost:80.
apiVersion: v1
kind: Service
metadata:
  name: heart-risk-api
  namespace: heart-risk
  labels:
    app: heart-risk-api
spec:
  type: LoadBalancer
  selector:
    app: heart-risk-api
  ports:
    - name: http
      port: 80
      targetPort: http
