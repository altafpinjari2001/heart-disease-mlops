[flake8]
max-line-length = 88
exclude = .venv,mlruns,mlartifacts,notebooks,.ipynb_checkpoints,build
# verbatim shell commands / diagram labels kept on one line for readability
per-file-ignores =
    scripts/build_report.py:E501
    scripts/architecture_diagram.py:E501

[tool:pytest]
testpaths = test
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
